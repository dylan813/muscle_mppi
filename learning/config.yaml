# Flow-matching policy training settings (learning/). Values follow gpc's
# humanoid example (gpc/examples/humanoid.py) unless noted. Every key is
# required, and unknown keys are rejected so a typo can't be ignored.

seed: 0                        # gpc: jax.random.key(0)

mppi_task:                     # the mppi_sim task whose plans the policy learns; its
  name: walk                   # horizon and n_knots set the policy's output (mppi.KnotSpline)
  tasks_yaml: controllers/muscle/utils/tasks.yaml   # relative to the repo root

model:                         # DenoisingCNN (learning/architectures.py)
  feature_dims: [128, 128, 128]
  timestep_embedding_dim: 64
  kernel_size: 3               # gpc's default

fit:                           # gpc's fit_policy (gpc/training.py)
  learning_rate: 1.0e-3
  batch_size: 128
  num_epochs: 10

checkpoint_every: 1            # rounds between policy checkpoints (humanoid example: 1)

loop:                          # gpc's train() rounds: collect episodes with mppi_sim, then fit
  num_rounds: 50               # gpc num_iters (humanoid: 50)
  episodes_per_round: 40       # gpc num_envs is 128 × 400 steps ≈ 51k rows; ours run ≈ 1,300 steps each
  parallel_episodes: 2         # mppi_sim processes at once
  threads_per_episode: 6       # OpenMP threads each (the task's num_threads); 2 × 6 = 12 in all
  policy_samples: 30           # gpc num_policy_samples: as many as MPPI's n_samples
  warm_start: 0.0              # gpc trains at 0: policy samples flow from noise
  policy_device: cpu           # cpu | cuda: where mppi_sim runs the policy (the pilot run: cpu)
  gifs_per_round: 1            # episodes rendered to a GIF in the round's folder (gpc num_videos: 2)

wandb:
  project: muscle-mppi-gpc
  run_name: null               # null: wandb picks one
  mode: online                 # online | offline | disabled
