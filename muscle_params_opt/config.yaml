# Settings of cmaes_walk.py, read when it starts.
#
# run:     how the search runs. A command-line flag of the same name overrides
#          its entry (e.g. --maxiter 30, --wandb-project x).
# search:  what it searches: starting point, step sizes, bounds.
#
# A resumed run (--resume) keeps its own popsize, sigma, seed, tolx, tolfun
# and search space; maxiter and workers apply to it.
# Each run's own names stay on the command line: --run-name, --results-dir.

run:
  maxiter:       15                  # generations in total, counting those of a resumed run
  popsize:       100                 # candidates per generation
  workers:       8                   # sims run in parallel, one OpenMP thread each
  seed:          null                # seed for CMA-ES's sampling; null: a new random one each run
  sigma:         1.0                 # scale on every search.sigma0
  tolx:          0.001               # pycma stops once every step size is below this (parameter units)
  tolfun:        0.001               # pycma stops once recent costs differ by less than this
  wandb_project: muscle-mppi-cmaes   # a resumed run must use its own

# lce_min, lce_max, pFLmax and FVmax take one value per joint type,
# [hip, thigh, calf]; stiffness one value for all joints.
search:

  # All 4 legs share the same value per joint type. X0, SIGMA0, LO and HI are
  # those of the Aug 4 2026 run that produced tasks.yaml's muscle values
  # (run name area_0, commit b0c904a), except the calf lce bounds and the
  # stiffness entries below.
  x0:
    lce_min:   [0.85, 0.82, 0.82]
    lce_max:   [1.09, 1.06, 1.18]
    pFLmax:    [0.54, 0.94, 0.21]
    FVmax:     [1.2, 1.3, 1.1]
    stiffness: 0.7

  # ~15% of each param's (HI - LO) range, recomputed for the current bounds.
  sigma0:
    lce_min:   [0.07, 0.07, 0.05]
    lce_max:   [0.07, 0.07, 0.03]
    pFLmax:    [0.25, 0.25, 0.25]
    FVmax:     [0.11, 0.11, 0.11]
    stiffness: 0.04

  # FVmax lower bound is kept strictly above 1.0: gait_generator._force_vel
  # divides by (FVmax - 1.0), so a candidate at or below 1.0 is a singularity.
  # Calf lce_min >= 0.60 and lce_max <= 1.25: outside them walk_fast is almost
  # never feasible (4000 uniform samples of the earlier 0.50-0.95 / 1.05-1.50
  # calf bounds: 1% feasible with lce_min < 0.59, 0% with lce_max > 1.32).
  # Stiffness 0.50-0.775: where both activations of a joint stay at least
  # 2 * noise_sigma_act from 0 and 1 for >= 85% of walk_fast, for 96% (at 0.50)
  # to 100% (0.60-0.775) of 400 feasible parameter sets sampled within these
  # bounds; at 0.80 for 0.2%, as one activation nears 1 - 2 * 0.1.
  lo:
    lce_min:   [0.50, 0.50, 0.60]
    lce_max:   [1.05, 1.05, 1.05]
    pFLmax:    [0.10, 0.10, 0.10]
    FVmax:     [1.05, 1.05, 1.05]
    stiffness: 0.50

  hi:
    lce_min:   [0.90, 0.90, 0.90]
    lce_max:   [1.50, 1.50, 1.25]
    pFLmax:    [1.80, 1.80, 1.80]
    FVmax:     [1.80, 1.80, 1.80]
    stiffness: 0.775
