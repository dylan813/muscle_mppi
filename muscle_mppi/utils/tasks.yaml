# muscle_mppi task configuration — edit here, no rebuild needed.
# Run the binary from build/: model_path is relative to the working directory.
#
# Joint order for all 3-element arrays (FL leg only, JOINT_OFFSET=3):
#   0: FL_hip   1: FL_thigh   2: FL_calf

# Shared muscle parameters — both tasks reference this anchor.
default_muscle: &default_muscle
  activation_alpha: 0.15
  tau_max:     [23.7, 23.7, 35.55]
  dq_max:      [30.1, 30.1, 20.07]
  b_damp:      [0.0, 0.5, 0.5]
  kd_sim:      [2.0, 3.5, 3.5]
  k_plus:      [5.0, 5.0, 5.0]
  k_minus:     [5.0, 5.0, 5.0]
  alpha_plus:  [10.0, 10.0, 10.0]
  alpha_minus: [10.0, 10.0, 10.0]
  # Passive spring onset (0.1 rad inside hard XML limits). Front thigh: [-1.5708, 3.4907]; knee: [-2.7227, -0.83776]
  q_plus0:     [0.9472, 3.3907, -0.9378]
  q_minus0:    [-0.9472, -1.4708, -2.6227]

# -----------------------------------------------------------------------
reach:
  model_path:   "../../unitree_mujoco/unitree_robots/go2/scene_suspended.xml"
  height_target: 0.0
  # FL foot target in world frame (x, y, z). Base is fixed at z=0.8.
  # FL hip is at (0.193, 0.142, 0.8). Max leg reach ~0.64m.
  foot_target:  [0.30, 0.25, 0.40]
  n_samples:    64
  horizon:      25
  substeps:     10
  n_iterations: 3
  lambda:       0.1
  beta1:        3.0
  beta2:        3.0
  dt:           0.002

  cost:
    height:        0.0
    orientation:   0.0
    posture:       1.0    # light regularization toward nominal pose
    contact_vel:   0.5    # damp foot velocity when near target
    contact_force: 0.0
    terminal:      50.0   # heavily penalize foot distance at end of horizon
    act_effort:    0.01
    vel_cmd:       0.0
    vel_des:       [0.0, 0.0, 0.0]
    foot_pos:      10.0   # per-step foot position error

  nominal_pose: [0.0, 0.67, -1.3]
  noise_sigma:  [0.05, 0.08, 0.08]

  muscle: *default_muscle
