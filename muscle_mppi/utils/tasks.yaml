# muscle_mppi task configuration — edit here, no rebuild needed.
# Run the binary from build/: model_path is relative to the working directory.
#
# --- Single-leg tasks (reach) ---
# Joint order (NUM_JOINTS=3, JOINT_OFFSET=3):
#   0: FL_hip   1: FL_thigh   2: FL_calf
#
# --- Quadruped tasks (walk) ---
# Joint order (NUM_JOINTS=12, JOINT_OFFSET=0):
#   0-2:  FR_hip, FR_thigh, FR_calf
#   3-5:  FL_hip, FL_thigh, FL_calf
#   6-8:  RR_hip, RR_thigh, RR_calf
#   9-11: RL_hip, RL_thigh, RL_calf

# -----------------------------------------------------------------------
# Single-leg muscle parameters (3 joints).
default_muscle: &default_muscle

  # Activation filter bandwidth (Hz). First-order filter: act += bandwidth * dt * (ctrl - act).
  # alpha = bandwidth * dt = 10 * 0.02 = 0.2, preserving the original 10 ms effective time constant
  # (was 100 Hz at dt=0.002; scaled down to match dt=0.02 so filter behaviour is unchanged).
  act_bandwidth: 10.0

  # Peak isometric force per joint (N). Maximum force when FL=1, FV=1, act=1.
  # Determined by: peak_force = tau_max / r
  #   r = (lce_max - lce_min) / (phi_max - phi_min)  [moment arm, dimensionless]
  #   tau_max from go2.xml ctrlrange: hip=23.7 Nm, thigh=23.7 Nm, calf=45.43 Nm
  #   r values: hip=0.1584, thigh=0.0617, calf=0.1781
  peak_force:    [149.7, 384.1, 255.1]

  # Joint angle range (rad) mapped linearly to [lce_min, lce_max] for the agonist muscle.
  # Taken from go2.xml joint limits, 0.1 rad inside the hard stops to avoid singularities at limits.
  # go2.xml limits — hip: [-1.0472, 1.0472], thigh: [-1.5708, 3.4907], calf: [-2.7227, -0.83776]
  phi_min:       [-0.9472, -1.4708, -2.6227]
  phi_max:       [0.9472,  3.3907,  -0.9378]

  # Fiber length range normalized by optimal isometric length (l_opt).
  # Both muscles in the antagonistic pair span [lce_min, lce_max] as the joint sweeps phi_min→phi_max.
  lce_min:       [0.75, 0.75, 0.75]
  lce_max:       [1.05, 1.05, 1.05]

  # Passive parallel elasticity scale. Force at maximum extension relative to peak_force.
  pFLmax:        [1.3, 1.3, 1.3]

  # Maximum fiber contraction velocity (fiber lengths / s). FV curve → 0 at lce_dot = -vmax.
  # Determined by: vmax = r * dq_max
  #   dq_max from Go2 URDF file found in Unitree documentation: hip=30.1 rad/s, thigh=30.1 rad/s, calf=15.70 rad/s
  #   r values: hip=0.1584, thigh=0.0617, calf=0.1781
  vmax:          [4.77, 1.86, 2.80]

  # Eccentric force amplification plateau. FV saturates at FVmax when the muscle is lengthening.
  FVmax:         [1.33, 1.33, 1.33]

  # MuJoCo joint damping (N·m·s/rad) written directly to simulation DOFs at startup.
  # Overrides the go2.xml default of 0.1. Values should match Go2 motor driver kd gains.
  kd_sim:        [2.0, 3.5, 3.5]

# -----------------------------------------------------------------------
# FL foot target: world frame (x, y, z). Base fixed at z≈0.8.
# FL hip at (0.193, 0.142, 0.8). Max leg reach ~0.64m.
# Action space: act[m] ∈ [0, 1] per muscle (NUM_MUSCLES=6, two per joint).
reach:
  model_path:    "../../unitree_mujoco/unitree_robots/go2/scene_suspended.xml"
  height_target: 0.0
  foot_targets:
    - [0.5,  0.1, 0.6 ]
    - [0.25, 0.1, 0.55]
    - [0.25, 0.3, 0.6 ]
  n_samples:     64
  horizon:       10
  lambda:        0.1
  dt:            0.02

  # OpenMP threads for the parallel rollout loop (one rollout per sample).
  # Omit or set to 0 to use the OpenMP default (all available cores).
  num_threads:   0

  # Spline-parameterized noise sampling: draw noise at
  # n_knots points spread across the horizon and cubic-interpolate the rest,
  # instead of independent per-timestep noise. Smoother action trajectories.
  sample_type:   "cubic"
  n_knots:       4

  cost:
    terminal:      500.0
    foot_pos:      10.0
    joint_vel:     0.05

  nominal_pose: [0.00571868, 0.608813, -1.21763]

  # Per-joint noise sigma (NUM_JOINTS=3). Both muscles of each pair share the same draw.
  noise_sigma_act: [0.02, 0.02, 0.02]

  muscle: *default_muscle

# -----------------------------------------------------------------------
# Quadruped muscle parameters (12 joints: (hip/thigh/calf)x(FR/FL/RR/RL))
default_muscle_quad: &default_muscle_quad
  act_bandwidth: 20.0
  peak_force:  [149.7, 384.1, 255.1,  149.7, 384.1, 255.1,  149.7, 384.1, 255.1,  149.7, 384.1, 255.1]
  phi_min:     [-0.9472, -1.4708, -2.6227,  -0.9472, -1.4708, -2.6227,  -0.9472, -1.4708, -2.6227,  -0.9472, -1.4708, -2.6227]
  phi_max:     [ 0.9472,  3.3907, -0.9378,   0.9472,  3.3907, -0.9378,   0.9472,  3.3907, -0.9378,   0.9472,  3.3907, -0.9378]
  lce_min:     [0.7118, 0.8777, 0.8667,  0.7118, 0.8777, 0.8667,  0.7118, 0.8777, 0.8667,  0.7118, 0.8777, 0.8667]
  lce_max:     [1.1104, 1.0504, 1.1446,  1.1104, 1.0504, 1.1446,  1.1104, 1.0504, 1.1446,  1.1104, 1.0504, 1.1446]
  pFLmax:      [0.3260, 1.3035, 0.3589,  0.3260, 1.3035, 0.3589,  0.3260, 1.3035, 0.3589,  0.3260, 1.3035, 0.3589]
  vmax:        [4.77, 1.86, 2.80,  4.77, 1.86, 2.80,  4.77, 1.86, 2.80,  4.77, 1.86, 2.80]
  FVmax:       [1.1459, 1.2520, 1.0597,  1.1459, 1.2520, 1.0597,  1.1459, 1.2520, 1.0597,  1.1459, 1.2520, 1.0597]
  kd_sim:      [2.0, 3.5, 3.5,  2.0, 3.5, 3.5,  2.0, 3.5, 3.5,  2.0, 3.5, 3.5]

# -----------------------------------------------------------------------
# Locomotion task
#
# `phases:` is an ordered waypoint sequence (mirrors RTWholeBodyMPPI's per-phase
# goal_pos/cmd_vel/desired_gait/goal_thresh/waiting_times arrays). MPPILocomotion
# advances to the next phase once the robot has stayed within goal_thresh of the
# current phase's goal_pos for waiting_time consecutive in-threshold ticks (not
# reset if it drifts back out in between — cumulative, matching RTWholeBodyMPPI).
# desired_gait is one of: in_place, walk, walk_fast, trot (see mppi_locomotion.cpp
# GAIT_*_PATH constants) — or set gait_path directly to an explicit TSV, which
# overrides desired_gait (used by the CMA-ES sweep in analysis/optimize/ to point
# at a per-candidate regenerated gait file).
walk:
  model_path:    "../../unitree_mujoco/unitree_robots/go2/scene.xml"
  height_target: 0.34
  n_samples:     30
  horizon:       40
  lambda:        0.1
  dt:            0.01

  # OpenMP threads for the parallel rollout loop (one rollout per sample).
  # Omit or set to 0 to use the OpenMP default (all available cores).
  num_threads:   0

  # Spline-parameterized noise sampling: draw noise at
  # n_knots points spread across the horizon and cubic-interpolate the rest,
  # instead of independent per-timestep noise. Smoother action trajectories.
  sample_type:   "cubic"
  n_knots:       4

  cost:
    pos_x:         300.0      # L1 x-position error to goal_pos[0]
    pos_y:         300.0      # L1 y-position error to goal_pos[1]
    pos_z:         500.0      # L1 height error to goal_pos[2]
    orientation:   400000.0   # (1 - |qw|)^2 quaternion distance from upright
    vel_x:         1.0        # forward velocity tracking
    vel_y:         0.0001     # lateral velocity tracking
    vel_z:         0.0001     # vertical velocity tracking
    ang_vel:       0.0001     # body angular velocity damping (x, y, z)
    gait_ref_weights: [800, 800, 800,  800, 800, 800,  800, 800, 800,  800, 800, 800]  # per-joint (FR/FL/RR/RL × hip/thigh/calf)
    gait_stiffness: 0.75     # constraint-line blend — must match generate_activation_gaits.py STIFFNESS

  # Single phase — same target/gait/cmd_vel this task used before the phases: migration.
  phases:
    - goal_pos:     [5.0, 0.0, 0.34]
      cmd_vel:      [0.2, 0.0]
      desired_gait: "walk_fast"
      goal_thresh:  0.2
      waiting_time: 0

  # 12 joints: FR(hip,thigh,calf), FL(hip,thigh,calf), RR(hip,thigh,calf), RL(hip,thigh,calf)
  nominal_pose: [0.00571868, 0.608813, -1.21763,  -0.00571868, 0.608813, -1.21763,  0.00571868, 0.608813, -1.21763,  -0.00571868, 0.608813, -1.21763]

  # Per-joint activation noise (applied independently to both muscles of each pair).
  noise_sigma_act: [0.06, 0.1, 0.1,  0.06, 0.1, 0.1,  0.06, 0.1, 0.1,  0.06, 0.1, 0.1]

  posture_bias: [-0.013492, -0.139178, -0.237088,  0.013492, -0.139179, -0.237088,
                 -0.036156, -0.157226, -0.266074,  0.036156, -0.157226, -0.266074]

  posture_FL1: [0.840162, 0.668695, 0.350412,  0.843239, 0.668695, 0.350412,
                0.832209, 0.666395, 0.454089,  0.851119, 0.666395, 0.454089]
  posture_FL2: [0.843239, 0.93456, 0.500727,  0.840162, 0.93456, 0.500727,
                0.851119, 0.935577, 0.569064,  0.832209, 0.935577, 0.569064]

  muscle: *default_muscle_quad

# -----------------------------------------------------------------------
# walk_rough: same straight-line +x traversal as `walk`, run over rough
# ground (scene_rough.xml — a repositioned copy of scene_terrain.xml's
# box-grid rubble field, not a heightfield) instead of flat ground. Not a
# RTWholeBodyMPPI port; deviates on purpose.
#
# The box field is shifted to x in [0.53, 2.87] (see scene_rough.xml), so
# the robot spawns on flat ground at x=0 and walks forward onto the rubble
# rather than spawning embedded in it. goal_pos below is set past the far
# edge of the field so the walk phase actually crosses it.
walk_rough:
  model_path:    "../../unitree_mujoco/unitree_robots/go2/scene_rough.xml"
  height_target: 0.34
  n_samples:     30
  horizon:       40
  lambda:        0.1
  dt:            0.01
  num_threads:   0
  sample_type:   "cubic"
  n_knots:       4

  cost:
    pos_x:         300.0
    pos_y:         300.0
    pos_z:         500.0
    orientation:   400000.0
    vel_x:         1.0
    vel_y:         0.0001
    vel_z:         0.0001
    ang_vel:       0.0001
    gait_ref_weights: [800, 800, 800,  800, 800, 800,  800, 800, 800,  800, 800, 800]
    gait_stiffness: 0.75

  sim_duration: 45.0
  phases:
    - goal_pos:     [3.2, 0.0, 0.34]
      cmd_vel:      [0.2, 0.0]
      desired_gait: "walk_fast"
      goal_thresh:  0.2
      waiting_time: 0

  nominal_pose: [0.00571868, 0.608813, -1.21763,  -0.00571868, 0.608813, -1.21763,  0.00571868, 0.608813, -1.21763,  -0.00571868, 0.608813, -1.21763]

  noise_sigma_act: [0.06, 0.1, 0.1,  0.06, 0.1, 0.1,  0.06, 0.1, 0.1,  0.06, 0.1, 0.1]

  posture_bias: [-0.013492, -0.139178, -0.237088,  0.013492, -0.139179, -0.237088,
                 -0.036156, -0.157226, -0.266074,  0.036156, -0.157226, -0.266074]

  posture_FL1: [0.840162, 0.668695, 0.350412,  0.843239, 0.668695, 0.350412,
                0.832209, 0.666395, 0.454089,  0.851119, 0.666395, 0.454089]
  posture_FL2: [0.843239, 0.93456, 0.500727,  0.840162, 0.93456, 0.500727,
                0.851119, 0.935577, 0.569064,  0.832209, 0.935577, 0.569064]

  muscle: *default_muscle_quad

# -----------------------------------------------------------------------
# climb_box: port of RTWholeBodyMPPI's climb_box_hw task (tasks.py) at
# literal geometry scale (see unitree_mujoco/terrain_tool/generate_climb_box.py).
# Named without the "_hw" suffix here: RTWholeBodyMPPI's sim_path and
# model_path point at the identical file for this task (the "_hw" there just
# means it was tuned with hardware deployment in mind, not that it's
# hardware-only), and muscle_mppi doesn't distinguish hw/sim task variants.
# Distinct from big_box: climbs a smaller box (0.2m, confirmed both from the
# real model's box geom size AND the task's own goal_pos z-delta, 0.47-0.27),
# pauses on top, then descends back down the far side -- rather than climbing
# up and staying up.
#
# Positions translated from RTWholeBodyMPPI's own world frame (-2.204 ->
# -0.304, moving in -x) to muscle_mppi's convention (spawn at x=0, +x
# direction), preserving the exact same relative deltas between phases.
# goal_pos z-values shifted +0.07 (Go1 baseline 0.27 -> Go2 baseline 0.34);
# the box's own height (0.2m, world-fixed) is untouched. Gait pattern (climb
# during "walk", cross/descend via "trot", holds via "in_place") and cost
# weights match the original exactly -- notably gentler than big_box's
# (smaller climb), including keeping vel_x at full strength (1.0, vs
# big_box's near-zero) and standard (not doubled) exploration noise.
climb_box:
  model_path:    "../../unitree_mujoco/unitree_robots/go2/scene_climb_box.xml"
  height_target: 0.34
  n_samples:     30
  horizon:       40
  lambda:        0.1
  dt:            0.01
  num_threads:   0
  sample_type:   "cubic"
  n_knots:       4

  cost:
    pos_x:         2000.0
    pos_y:         2000.0
    pos_z:         5000.0
    orientation:   200000.0
    vel_x:         1.0
    vel_y:         0.0001
    vel_z:         0.0001
    ang_vel:       0.0001
    gait_ref_weights: [800, 800, 800,  800, 800, 800,  800, 800, 800,  800, 800, 800]
    gait_stiffness: 0.75

  phases:
    - goal_pos:     [0.0, 0.0, 0.34]
      cmd_vel:      [0.0, 0.0]
      desired_gait: "in_place"
      goal_thresh:  0.2
      waiting_time: 50
    - goal_pos:     [0.5, 0.0, 0.54]
      cmd_vel:      [0.5, 0.0]
      desired_gait: "walk"
      goal_thresh:  0.2
      waiting_time: 0
    - goal_pos:     [0.9, 0.0, 0.54]
      cmd_vel:      [0.5, 0.0]
      desired_gait: "trot"
      goal_thresh:  0.2
      waiting_time: 0
      # Doubled thigh/calf exploration noise during trot -- matches RTWholeBodyMPPI's
      # next_goal(), which switches to this value specifically for trot phases
      # regardless of the task's declared baseline (0.06,0.1,0.1 here).
      noise_sigma_act: [0.06, 0.2, 0.2,  0.06, 0.2, 0.2,  0.06, 0.2, 0.2,  0.06, 0.2, 0.2]
    - goal_pos:     [0.9, 0.0, 0.54]
      cmd_vel:      [0.0, 0.0]
      desired_gait: "in_place"
      goal_thresh:  0.2
      waiting_time: 200
    - goal_pos:     [1.9, 0.0, 0.34]
      cmd_vel:      [0.5, 0.0]
      desired_gait: "trot"
      goal_thresh:  0.2
      waiting_time: 0
      noise_sigma_act: [0.06, 0.2, 0.2,  0.06, 0.2, 0.2,  0.06, 0.2, 0.2,  0.06, 0.2, 0.2]
    - goal_pos:     [1.9, 0.0, 0.34]
      cmd_vel:      [0.0, 0.0]
      desired_gait: "in_place"
      goal_thresh:  0.2
      waiting_time: 200

  nominal_pose: [0.00571868, 0.608813, -1.21763,  -0.00571868, 0.608813, -1.21763,  0.00571868, 0.608813, -1.21763,  -0.00571868, 0.608813, -1.21763]

  noise_sigma_act: [0.06, 0.1, 0.1,  0.06, 0.1, 0.1,  0.06, 0.1, 0.1,  0.06, 0.1, 0.1]

  posture_bias: [-0.013492, -0.139178, -0.237088,  0.013492, -0.139179, -0.237088,
                 -0.036156, -0.157226, -0.266074,  0.036156, -0.157226, -0.266074]

  posture_FL1: [0.840162, 0.668695, 0.350412,  0.843239, 0.668695, 0.350412,
                0.832209, 0.666395, 0.454089,  0.851119, 0.666395, 0.454089]
  posture_FL2: [0.843239, 0.93456, 0.500727,  0.840162, 0.93456, 0.500727,
                0.851119, 0.935577, 0.569064,  0.832209, 0.935577, 0.569064]

  muscle: *default_muscle_quad
